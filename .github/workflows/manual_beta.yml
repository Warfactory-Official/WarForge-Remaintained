name: Manual Beta Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_PROJECT_ID: "1340172"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Gradle runs on 21; the nodes compile with the 17 and 25 toolchains.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/*.gradle.kts
            **/gradle-wrapper.properties
            stonecutter.properties.toml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read the mod version from stonecutter.properties.toml and compute tag
        id: ver
        run: |
          set -euo pipefail
          MOD_VERSION=$(awk -F'"' '/^\[mod\]/{m=1;next} /^\[/{m=0} m && /^version *=/{print $2; exit}' stonecutter.properties.toml)
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "::error::[mod] version is empty in stonecutter.properties.toml"; exit 1
          fi
          echo "MOD_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${MOD_VERSION}" >> "$GITHUB_ENV"
          echo "tag=v${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      #      - name: Ensure tag doesn't already exist on origin
      #        run: |
      #          set -euo pipefail
      #          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
      #            echo "::error::Tag ${TAG} already exists on origin. Canceling."; exit 1
      #          fi
      #
      - name: Build with Gradle
        run: ./gradlew clean buildAll --no-daemon
      #
      - name: Find mod jar (non-dev/non-sources/non-api)
        run: |
          set -euo pipefail
          # FILE: the 1.21.1 jar, which the single-version build used to make. FILES: the jar of every node.
          FILE=$(ls -t versions/1.21.1-neoforge/build/libs/*.jar 2>/dev/null | grep -vE '(-dev|-sources|-api)\.jar$' | head -n1 || true)
          if [[ -z "${FILE}" ]]; then
            echo "::error::No release jar found in versions/1.21.1-neoforge/build/libs"; ls -al versions/*/build/libs || true; exit 1
          fi
          echo "FILE=${FILE}" >> "$GITHUB_ENV"
          {
            echo "FILES<<EOF"
            ls versions/*/build/libs/*.jar | grep -vE '(-dev|-sources|-api)\.jar$'
            echo "EOF"
          } >> "$GITHUB_ENV"
      #
      #      - name: Create and push tag
      #        run: |
      #          set -euo pipefail
      #          git config user.name github-actions
      #          git config user.email github-actions@github.com
      #          git tag "${TAG}"
      #          git push origin "${TAG}"
