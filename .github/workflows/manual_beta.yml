      #          prerelease: true
      #          generate_release_notes: true
      #          files: ${{ env.FILE }}
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      - name: Publish to CurseForge
#        env:
#          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
#          TAG: ${{ env.TAG }}
#          FILE: ${{ env.FILE }}
#        run: |
#          curl -X POST "https://minecraft.curseforge.com/api/projects/1312314/upload-file" \
#            -H "x-api-token: ${CF_API_TOKEN}" \
#            -F "metadata={
#              \"changelog\": \"See GitHub release ${TAG} for notes.\",
#              \"changelogType\": \"text\",
#              \"displayName\": \"${TAG}\",
#              \"releaseType\": \"beta\",
#              \"gameVersions\": [6756],
#            };type=application/json" \
#            -F "file=@${FILE}"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MPR_TOKEN }}
          TAG: ${{ env.TAG }}
          FILE: ${{ env.FILE }}
        run: |
          curl -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -F "data={
              \"name\": \"${TAG}\",
              \"version_number\": \"${TAG}\",
              \"changelog\": \"See GitHub release ${TAG} for notes.\",
              \"version_type\": \"beta\",
              \"game_versions\": [\"1.12.2\"],
              \"loaders\": [\"forge\"],
              \"featured\": true,
              \"project_id\": \"2oTs5GKQ\"
            };type=application/json" \
            -F "file_parts[]=@${FILE}"
