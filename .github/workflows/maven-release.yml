name: Publish Maven Release

on:
  workflow_dispatch:

concurrency:
  group: maven-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Gradle runs on 21; the nodes compile with the 17 and 25 toolchains.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/*.gradle.kts
            **/gradle-wrapper.properties
            stonecutter.properties.toml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve mod version
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION=$(awk -F'"' '/^\[mod\]/{m=1;next} /^\[/{m=0} m && /^version *=/{print $2; exit}' stonecutter.properties.toml)
          if [[ -z "${MOD_VERSION}" ]]; then
            echo "::error::[mod] version is empty or missing in stonecutter.properties.toml"; exit 1
          fi
          echo "RELEASE_VERSION=${MOD_VERSION}" >> "$GITHUB_ENV"

      - name: Publish to releases
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          ./gradlew \
            publishMavenJavaPublicationToMavenRepository \
            --parallel \
            --max-workers=2 \
            --no-daemon \
            --stacktrace
