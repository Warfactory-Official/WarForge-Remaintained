name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with settings.gradle.kts and build-logic/src/main/kotlin/Variants.kt.
        node: [1.20.1-forge, 1.21.1-neoforge, 26.1.2-neoforge, 26.2-neoforge]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Gradle runs on 21; the nodes compile with the 17 and 25 toolchains, which Gradle finds or downloads (foojay).
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/*.gradle.kts
            **/gradle-wrapper.properties
            gradle.properties
            stonecutter.properties.toml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew :${{ matrix.node }}:build :${{ matrix.node }}:checkNoVersionGuards --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true  # org artifact quota full => still publish
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

      - name: Run server
        run: |
          set -euo pipefail

          RUNDIR="versions/${{ matrix.node }}/run"
          mkdir -p "$RUNDIR"
          echo "eula=true" > "$RUNDIR/eula.txt"

          # Set a constant seed with a village at spawn
          printf "level-seed=-6202107849386030209\nonline-mode=false\n" > "$RUNDIR/server.properties"

          echo "stop" > stop.txt
          set +e
          timeout 180s ./gradlew :${{ matrix.node }}:runServer --stacktrace < stop.txt 2>&1 | tee server.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "runServer exited with code $code"
            exit "$code"
          fi

      - name: Validate server run
        run: |
          set -euo pipefail

          RUNDIR="versions/${{ matrix.node }}/run"
          CRASH="crash-reports"
          SERVERLOG="$RUNDIR/logs/latest.log"

          shopt -s nullglob

          crash_reports=("$RUNDIR/$CRASH/crash"*.txt)

          if [ "${#crash_reports[@]}" -gt 0 ]; then
            latest_crash_report="${crash_reports[-1]}"
            {
              printf 'Latest crash report detected %s:\n' "${latest_crash_report##*/}"
              cat "$latest_crash_report"
            } >&2
            exit 1
          fi

          if [ -f "$SERVERLOG" ]; then
            if grep -qF 'Fatal errors were detected' "$SERVERLOG"; then
              {
                printf 'Fatal errors detected:\n'
                cat "$SERVERLOG"
              } >&2
              exit 1
            fi

            if grep -qF 'The state engine was in incorrect state ERRORED and forced into state SERVER_STOPPED' \
              "$SERVERLOG"; then
              {
                printf 'Server force stopped:\n'
                cat "$SERVERLOG"
              } >&2
              exit 1
            fi

            if grep -qF 'Exception stopping the server' "$SERVERLOG"; then
              {
                printf "Server didn't shut down cleanly:\n"
                cat "$SERVERLOG"
              } >&2
              exit 1
            fi

            # 1.20.1 and 1.21.1 print 'type "help" or "?"'; 26.x prints 'type "help"'.
            if ! grep -qP '.+Done \(.+\)\! For help, type "help"' "$SERVERLOG"; then
              {
                printf 'Server did not finish startup:\n'
                cat "$SERVERLOG"
              } >&2
              exit 1
            fi
          else
            echo "No latest.log found at $SERVERLOG (server may not have fully started)."
          fi

          echo 'No crash reports detected'
