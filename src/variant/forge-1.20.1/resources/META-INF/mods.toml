modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"
issueTrackerURL="https://github.com/Warfactory-Offical/WarForge-Remaintained/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
logoFile=""

# Mixin configs are listed in the jar manifest (MixinConfigs) on Forge.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_dependency_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# LDLib (v1): UI framework on Forge 1.20.1.
[[dependencies.${mod_id}]]
    modId="ldlib"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="journeymap"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaerominimap"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
